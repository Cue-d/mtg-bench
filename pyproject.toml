[project]
name = "mtgbench-dataroom"
version = "0.1.0"
description = "Prototype harnesses and smokes for MTG agent benchmarking."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2",
    "websocket-client>=1.8,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
